appId: com.tuncerbasdag.mora-iptv-player
productName: Mora IPTV Player
copyright: Copyright (c) 2026 Tuncer Başdağ
directories:
  output: release
  buildResources: build
# Only the desktop shell + web server + built UI go into the package (source code, tests, Tizen and portal are excluded).
files:
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - apps/desktop/**
  - "!apps/desktop/test/**"
  - apps/web/server.mjs
  - apps/web/public/**
  - "!apps/web/public/**/*.map"
asar: true
# File names are fixed and have no spaces: GitHub release assets and update files (latest*.yml) refer to them.
artifactName: Mora-IPTV-Player-${version}-${os}-${arch}.${ext}
mac:
  identity: "-" # ad-hoc sign the whole bundle: Apple Silicon refuses apps whose signature is missing/broken ("damaged")
  hardenedRuntime: false # ad-hoc + hardened runtime needs extra entitlements or the app fails to launch
  category: public.app-category.video
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] } # macOS auto-update requires a zip
win:
  target:
    - { target: nsis, arch: [x64] }
nsis:
  oneClick: true
  perMachine: false
  differentialPackage: false # no .exe.blockmap: updates download the full installer
publish:
  provider: github
  owner: tuncerbasdag
  repo: mora-iptv-player
  releaseType: draft # uploaded as a draft; after you review it and click "Publish" on GitHub, the update becomes visible
