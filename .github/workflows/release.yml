name: Release

on:
  push:
    branches:
      - main
  # Re-run packaging for an already-tagged version (e.g. after a failed release).
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version to (re)build, without the "v" (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  version:
    name: Determine Semantic Version
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.check.outputs.bump || steps.manual.outputs.bump }}
      version: ${{ steps.check.outputs.version || steps.manual.outputs.version }}
    steps:
      - name: Use the requested version (manual run)
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          echo "$REQUESTED" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Invalid version: $REQUESTED"; exit 1; }
          echo "bump=manual" >> "$GITHUB_OUTPUT"
          echo "version=$REQUESTED" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with:
          node-version: 24

      - name: Inspect commit message for Conventional Commits
        id: check
        if: github.event_name == 'push'
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"

          BUMP="none"
          if echo "$MSG" | grep -qE "(BREAKING CHANGE:|!:)"; then
            BUMP="major"
          elif echo "$MSG" | grep -qE "^feat(\(.*\))?:"; then
            BUMP="minor"
          elif echo "$MSG" | grep -qE "^fix(\(.*\))?:"; then
            BUMP="patch"
          fi

          echo "Determined bump: $BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

          if [ "$BUMP" = "none" ]; then
            echo "No version bump needed (chore, docs, refactor, etc.). Skipping release."
            exit 0
          fi

          # Read current version and bump it
          npm version "$BUMP" --no-git-tag-version
          NEW_VER=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VER"
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"

          # Commit bumped package.json and push tag back to main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v$NEW_VER [skip ci]"
          git tag "v$NEW_VER"
          git push origin main
          git push origin "v$NEW_VER"

  verify:
    name: Verify & Test
    needs: version
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.version.outputs.version }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Create the release ONCE, before the platform builds start. Without this, the macOS and Windows
  # jobs race and each creates its own draft release for the same tag (assets end up split in two).
  release:
    name: Create draft release
    needs: [version, verify]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # `gh release view <tag>` cannot see drafts; list them instead.
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep -qx "v$VERSION"; then
            echo "Release v$VERSION already exists; reusing it."
          else
            BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
            cat > notes.md <<EOF
          ## Download

          | Your computer | Download |
          | --- | --- |
          | **Mac with Apple Silicon** (M1, M2, M3, M4 ...) | [Mora-IPTV-Player-$VERSION-mac-arm64.dmg]($BASE/Mora-IPTV-Player-$VERSION-mac-arm64.dmg) |
          | **Mac with an Intel processor** | [Mora-IPTV-Player-$VERSION-mac-x64.dmg]($BASE/Mora-IPTV-Player-$VERSION-mac-x64.dmg) |
          | **Windows 10 / 11 (64-bit)** | [Mora-IPTV-Player-$VERSION-win-x64.exe]($BASE/Mora-IPTV-Player-$VERSION-win-x64.exe) |

          Not sure which Mac you have? Open the Apple menu, then **About This Mac**: "Chip: Apple M..." means Apple Silicon, "Processor: Intel..." means Intel.

          The \`.zip\` and \`latest*.yml\` files are used by the app's built-in updater; you do not need to download them.
          To verify a download, compare it with \`SHA256SUMS.txt\` (for example \`shasum -a 256 -c SHA256SUMS.txt\` in the download folder).

          ## First launch

          The app is not signed by Apple or Microsoft (it is a free personal project with open source code), so your system warns you the first time.

          - **macOS:** after "Not Opened" appears, click **Done**, then open **System Settings, Privacy & Security**, scroll to **Security** and click **Open Anyway** next to "Mora IPTV Player". If that does not help, run this once in Terminal: \`xattr -dr com.apple.quarantine "/Applications/Mora IPTV Player.app"\`
          - **Windows:** on "Windows protected your PC", click **More info**, then **Run anyway**.

          Later updates installed from inside the app do not show this warning again.

          ## Disclaimer

          Mora IPTV Player is only a media player. It does not include, host, sell, recommend or link to any channels, playlists or IPTV subscriptions. You are solely responsible for the content you add and for making sure you have the right to watch it.

          ## What's changed
          EOF
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Mora IPTV Player $VERSION" --notes-file notes.md --generate-notes
          fi

  package:
    name: Package (${{ matrix.os }})
    needs: [version, verify, release]
    if: needs.version.outputs.bump != 'none'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.version.outputs.version }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - name: Build and upload installers
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # Publish only after BOTH platforms uploaded their files (release immutability locks assets once published).
  publish:
    name: Publish release
    needs: [version, package]
    if: needs.version.outputs.bump != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Blockmaps are only for delta updates; the Mac updater downloads the full zip, so drop them.
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(endswith(".blockmap"))' |
            while read -r name; do gh release delete-asset "v$VERSION" "$name" --repo "$GITHUB_REPOSITORY" --yes; done

          # Checksums of everything a person (or the updater) downloads.
          mkdir dl && cd dl
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe'
          sha256sum *.dmg *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "v$VERSION" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"

          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
