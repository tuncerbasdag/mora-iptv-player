name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Pull requests are not accepted, but ideas are welcome. This project provides **no content**, so requests for channel lists, providers or content sources cannot be handled.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Samsung TV (Tizen)
        - Windows app
        - macOS app
        - Browser (localhost)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered (optional)
