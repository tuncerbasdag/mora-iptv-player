<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Mora IPTV Player</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="$WEBAPIS/webapis/webapis.js"></script>
  </head>
  <body>
    <!--
      The actual video position/size is set on a separate hardware layer via webapis.avplay.setDisplayRect()
      (see tizenPlayerAdapter.ts) — the CSS size of this <object>
      does not affect playback; it is only needed so the AVPlay API context exists.
      We keep it small: when previewing in a non-Tizen browser (this is only a cosmetic
      preview convenience; on a real TV AVPlay is recognized and this box is never shown)
      it keeps the "plugin not supported" box from covering the whole screen.
    -->
    <object id="av-player" type="application/avplayer" style="position: absolute; top: 0; left: 0; width: 1px; height: 1px; z-index: -1"></object>
    <div id="app"></div>
    <script src="bundle.js"></script>
  </body>
</html>
